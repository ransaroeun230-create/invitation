<!DOCTYPE html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · ផ្ទាំងគ្រប់គ្រង</title>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="common.css"></head><body>
<div class="wrap"><header><h1>ផ្ទាំងគ្រប់គ្រង · Admin</h1><div id="who"></div></header>
<div class="grid kpis" id="k"></div>
<div class="card" style="margin-bottom:12px"><h2>ចូលមើល ៣០ ថ្ងៃចុងក្រោយ</h2><div id="chart"></div></div>
<div class="card" style="margin-bottom:12px"><h2>តំណសំបុត្រទាំងអស់</h2><div class="scroll"><table id="inv"></table></div></div>
<div class="card"><div class="row"><h2 style="margin:0">អ្នកប្រើប្រាស់</h2><input id="q" placeholder="ស្វែងរក…" style="max-width:220px"></div><div class="scroll"><table id="us"></table></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="auth.js"></script>
<script>
const $=s=>document.querySelector(s);let U=[];
function chart(rows){const N=30,d=[...Array(N)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-(N-1-i));return{k:x.toISOString().slice(0,10),v:0}});const m=Object.fromEntries(d.map(x=>[x.k,x]));rows.forEach(r=>{const k=r.created_at.slice(0,10);if(m[k])m[k].v++});
 const mx=Math.max(1,...d.map(x=>x.v)),W=560,H=150,p=20;const pts=d.map((x,i)=>[p+i*(W-2*p)/(N-1),H-p-x.v/mx*(H-2*p)]);
 $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%"><path d="${pts.map((a,i)=>(i?'L':'M')+a[0].toFixed(1)+' '+a[1].toFixed(1)).join('')}" fill="none" stroke="#e8c45a" stroke-width="2.2"/><text x="2" y="12" fill="#9db5a5" font-size="10">${kh(mx)}</text></svg>`}
function users(f){$('#us').innerHTML='<tr><th>ឈ្មោះ</th><th>អ៊ីមែល</th><th>ចូលតាម</th><th>គម្រោង</th><th>តួនាទី</th><th>ចុះឈ្មោះ</th></tr>'+U.filter(u=>((u.name||'')+(u.email||'')).toLowerCase().includes(f)).map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.provider||'email')}</td><td><select data-p="${u.id}" style="width:auto;padding:3px 6px"><option ${u.plan==='free'?'selected':''}>free</option><option ${u.plan==='pro'?'selected':''}>pro</option></select></td><td><span class="pill ${u.role==='admin'?'pro':''}">${esc(u.role)}</span></td><td>${new Date(u.created_at).toLocaleDateString('km-KH')}</td></tr>`).join('');
 document.querySelectorAll('[data-p]').forEach(s=>s.onchange=()=>sb.from('profiles').update({plan:s.value}).eq('id',s.dataset.p))}
(async()=>{const P=await requireRole('admin');if(!P)return;$('#who').innerHTML=whoHtml(P);
 const since=new Date(Date.now()-30*864e5).toISOString();
 const [pr,iv,vw]=await Promise.all([sb.from('profiles').select('*').order('created_at',{ascending:false}),sb.from('invitations').select('*').order('created_at',{ascending:false}),sb.from('views').select('invitation_id,created_at').gte('created_at',since).limit(50000)]);
 U=pr.data||[];const I=iv.data||[],V=vw.data||[],c={};V.forEach(v=>c[v.invitation_id]=(c[v.invitation_id]||0)+1);
 const owner=Object.fromEntries(U.map(u=>[u.id,u.name||u.email]));
 $('#k').innerHTML=[['អ្នកប្រើ',U.length],['សមាជិក Pro',U.filter(u=>u.plan==='pro').length],['សំបុត្រ',I.length],['ចូលមើល ៣០ ថ្ងៃ',V.length]].map(a=>`<div class="card k"><small>${a[0]}</small><b>${kh(a[1])}</b></div>`).join('');
 chart(V);
 $('#inv').innerHTML='<tr><th>ឈ្មោះ</th><th>Slug</th><th>ម្ចាស់</th><th>Template</th><th>ចូលមើល ៣០ ថ្ងៃ</th><th>ស្ថានភាព</th></tr>'+I.map(i=>`<tr><td>${esc(i.title)}</td><td>${esc(i.slug)}</td><td>${esc(owner[i.owner]||'-')}</td><td>${esc(i.template)}</td><td>${kh(c[i.id]||0)}</td><td><span class="pill ${i.active?'':'off'}">${i.active?'សកម្ម':'បិទ'}</span></td></tr>`).join('');
 users('');$('#q').oninput=e=>users(e.target.value.toLowerCase())})();
</script></body></html>
